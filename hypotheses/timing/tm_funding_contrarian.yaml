id: tm_funding_contrarian
title: Foule à levier d'un côté (taux de financement extrême, contre-tendance)
volet: timing
created: "2026-10-14"
mechanism: >-
  Un taux de financement très positif signale que les acheteurs à levier sont nombreux et paient pour rester : leur position est fragile (liquidations en cascade à la baisse) et leur demande future est déjà consommée, d'où une sous-performance.
horizon_s: 86400
universe: perp
features: [funding_rate]
parameters:
  - name: lookback_h
    values: [8, 24, 72]
  - name: horizon_h
    values: [8, 24, 72]
cost_round_trip_frac: 0.0022        # 2 jambes taker : 0,05 % + ½ spread + 0,05 % de glissement
min_edge_frac: 0.10                 # 10 %/an net, après frais et financement
edge_basis: per_year
abandon: >-
  Abandon si DSR < 0,95 sur tous les essais du volet, si l'écart de Sharpe avec le buy & hold
  n'a pas un IC bootstrap à 95 % strictement positif, ou si le résultat ne tient pas sur 3
  sous-périodes et sur les deux moitiés de l'univers. Le hold-out (depuis 2025-10-01) n'est lu
  qu'une fois, pour le meilleur candidat.
