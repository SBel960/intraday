id: tm_pre_fomc
title: Achat de BTC dans les heures qui précèdent le communiqué de la Fed
volet: timing
created: "2026-10-14"
mechanism: >-
  Phase 9 (docs/SPEC_EVENEMENTS.md). Dérive haussière avant les communiqués du FOMC, documentée
  sur les actions (Lucca et Moench, 2015) : l'incertitude se résout, les vendeurs couverts se
  retirent. Le contrat BTCUSDT est acheté k heures avant chaque communiqué programmé (dates
  connues des mois à l'avance, events/calendar.py) et vendu à l'heure du communiqué. 45
  communiqués avant le hold-out.
horizon_s: 86400
universe: perp
features: [fomc_calendar, close_1h]
parameters:
  - name: lookback_h
    values: [12, 24]
  - name: horizon_h
    values: [1]
  - name: signed
    values: [1]
  - name: persistent
    values: [1]
  - name: n_long
    values: [1]
  - name: n_short
    values: [0]
cost_round_trip_frac: 0.0012
min_edge_frac: 0.03
edge_basis: per_year
abandon: >-
  Abandon si DSR < 0,95 sur tous les essais du volet timing, si l'écart de Sharpe avec le buy &
  hold BTC n'a pas un IC bootstrap strictement positif, ou si le résultat ne tient pas sur les
  années. Hold-out (depuis 2025-10-01) lu une seule fois.
