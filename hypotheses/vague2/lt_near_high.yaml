id: lt_near_high
title: Proximité du plus haut sur un an (ancrage)
volet: longterm
created: "2026-09-26"
mechanism: >-
  Les investisseurs s'ancrent sur le plus haut de l'année : près de ce niveau, ils vendent trop
  tôt et freinent la hausse que les nouvelles justifient, puis le prix rattrape quand le niveau
  cède (George & Hwang 2004, « 52-week high »). Loin du plus haut, l'actif est en tendance
  baissière durable. Être investi seulement près du plus haut évite les longues baisses.
horizon_s: 604800
universe: trade                     # chaque paire tradée, poche de 1/N
features: [close_1d]
parameters:
  - name: min_ratio                 # investi si clôture ≥ q × plus haut des 12 derniers mois
    values: [0.7, 0.85]
cost_round_trip_frac: 0.004
min_edge_frac: 0.03
edge_basis: per_year
abandon: >-
  Abandon si DSR < 0,95, ou si l'écart de Sharpe avec le buy & hold n'a pas un intervalle de
  confiance à 95 % strictement positif, ou si le résultat ne tient pas sur 3 années dont une
  baissière.
