id: lt_volume_shock
title: Choc de volume haussier (attention soudaine)
volet: longterm
created: "2026-09-26"
mechanism: >-
  Un volume très supérieur à la normale sur une journée de hausse signale l'arrivée de nouveaux
  acheteurs (nouvelle, cotation, attention médiatique) ; l'information se diffuse lentement et
  l'afflux se poursuit quelques semaines (effet d'attention, Barber & Odean). Acheter après le
  choc et tenir trois semaines laisse le temps à la diffusion.
horizon_s: 1814400                  # détention de 3 semaines
universe: trade
features: [close_1d, volume_quote_1d]
parameters:
  - name: volume_ratio              # volume du jour ≥ k × médiane des 30 jours précédents, jour haussier
    values: [2, 3]
cost_round_trip_frac: 0.004
min_edge_frac: 0.02                 # par trade : couvrir 5 fois l'aller-retour (~0,4 %)
edge_basis: per_trade
abandon: >-
  Abandon si DSR < 0,95, ou si le rendement net médian par trade n'est pas strictement positif
  avec un intervalle de confiance à 95 %, ou si moins de 30 trades sur l'historique.
