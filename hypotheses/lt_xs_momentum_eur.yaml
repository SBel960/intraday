id: lt_xs_momentum_eur
title: Momentum transversal sur les paires EUR liquides
volet: longterm
created: "2026-09-26"
mechanism: >-
  Même mécanisme que lt_xs_momentum (les capitaux se concentrent sur les cryptos qui
  surperforment), appliqué à un univers tradé assez large pour que « les meilleures » veuille
  dire quelque chose : toutes les paires EUR liquides point-in-time, et non 3 paires fixes.
horizon_s: 604800
universe: trade_eur                 # paires EUR point-in-time, volume médian 30 j ≥ seuil de la config
features: [close_1d, volume_quote_1d]
parameters:
  - name: lookback_days             # classement sur ln(C_{t-7} / C_{t-L}), 7 derniers jours sautés
    values: [30, 90]
  - name: top_k                     # 3 lignes : le maximum raisonnable à 50 € (minimum 5 € par ordre)
    values: [3]
cost_round_trip_frac: 0.004
min_edge_frac: 0.05
edge_basis: per_year
abandon: >-
  Abandon si DSR < 0,95, ou si l'écart de Sharpe avec le panier équipondéré des mêmes paires n'a
  pas un intervalle de confiance à 95 % strictement positif, ou si les coûts dépassent la moitié
  de l'edge visé à 50 €.
