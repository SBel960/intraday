id: mk_trend
title: Suivi de tendance multi-actifs pondéré par le risque (time-series momentum)
volet: multi
created: "2026-10-14"
mechanism: >-
  Sous-réaction à l'information puis comportement grégaire et couvertures : la tendance d'un
  marché sur 1 à 12 mois se prolonge (Moskowitz, Ooi et Pedersen, 2012 ; Hurst, Ooi et
  Pedersen, un siècle de données). Chaque marché est acheté si sa tendance est positive, vendu
  si elle est négative, avec un poids inverse de sa volatilité ; la diversification entre
  actions, taux, devises et matières premières porte le rendement.
horizon_s: 1814400
universe: markets
features: [close_1d]
parameters:
  - name: lookback_d
    values: [21, 63, 126, 252]
  - name: horizon_d
    values: [5, 21]
  - name: signed
    values: [1]
  - name: n_long
    values: [50]
  - name: n_short
    values: [50]
cost_round_trip_frac: 0.0015
min_edge_frac: 0.03
edge_basis: per_year
abandon: >-
  Abandon si DSR < 0,95 sur les essais du volet multi, si l'écart de Sharpe avec le panier de
  tous les marchés (poids inverses de la volatilité) n'a pas un IC bootstrap à 95 %
  strictement positif, ou si le résultat ne tient pas sur 3 années et sur les deux moitiés des
  marchés. Hold-out (depuis 2024-10-01) lu une seule fois, pour le meilleur candidat.
