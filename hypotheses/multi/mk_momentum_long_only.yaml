id: mk_momentum_long_only
title: Rotation acheteuse vers les 8 marchés les plus forts (sans vente à découvert)
volet: multi
created: "2026-10-14"
mechanism: >-
  Rotation tactique classique (« dual momentum ») : ne détenir que les marchés les plus forts
  des 6 à 12 derniers mois, quelle que soit leur classe ; sortir des marchés en baisse durable
  évite une partie des grands krachs. Comparée au panier de tous les marchés.
horizon_s: 1814400
universe: markets
features: [close_1d]
parameters:
  - name: lookback_d
    values: [126, 252]
  - name: horizon_d
    values: [21]
  - name: n_long
    values: [8]
  - name: n_short
    values: [0]
cost_round_trip_frac: 0.0015
min_edge_frac: 0.03
edge_basis: per_year
abandon: >-
  Abandon si DSR < 0,95 sur les essais du volet multi, si l'écart de Sharpe avec le panier de
  tous les marchés (poids inverses de la volatilité) n'a pas un IC bootstrap à 95 %
  strictement positif, ou si le résultat ne tient pas sur 3 années et sur les deux moitiés des
  marchés. Hold-out (depuis 2024-10-01) lu une seule fois, pour le meilleur candidat.
