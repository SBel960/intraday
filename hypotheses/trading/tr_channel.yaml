id: tr_channel
title: Sortie de range de 1 à 5 jours (cassure, signé)
volet: trading
created: "2026-10-14"
mechanism: >-
  Au-dessus du plus haut d'un range de plusieurs heures, les ordres stop des vendeurs et les
  acheteurs de cassure accélèrent le mouvement (et inversement sous le plus bas). Position dans
  le range centrée ; moitié haute achetée, moitié basse vendue.
horizon_s: 86400
universe: fx_cfd
features: [high_1h, low_1h, close_1h]
parameters:
  - name: lookback_h
    values: [24, 120]
  - name: horizon_h
    values: [4, 24]
  - name: signed
    values: [1]
  - name: n_long
    values: [50]
  - name: n_short
    values: [50]
cost_round_trip_frac: 0.0003
min_edge_frac: 0.03
edge_basis: per_year
abandon: >-
  Abandon si DSR < 0,95 sur les essais du volet trading, si l'écart de Sharpe avec le panier
  de tous les instruments n'a pas un IC bootstrap à 95 % strictement positif, ou si le
  résultat ne tient pas sur 3 années et sur les deux moitiés des instruments. Hold-out (depuis
  2024-10-01) lu une seule fois, pour le meilleur candidat.
