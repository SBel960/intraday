id: tr_trend_band
title: Tendance de 1 à 5 jours, seulement quand elle est exceptionnelle
volet: trading
created: "2026-10-14"
mechanism: >-
  Vague 2. Un mouvement de plusieurs jours très au-delà de sa variabilité habituelle signale
  un changement d'information (banque centrale, choc macro) qui met du temps à être intégré ;
  on le suit tant que la tendance ne s'est pas éteinte (sortie à 0).
horizon_s: 3600
universe: fx_cfd
features: [close_1h]
parameters:
  - name: lookback_h
    values: [24, 120]
  - name: horizon_h
    values: [1]
  - name: enter_z
    values: [2]
  - name: exit_z
    values: [0]
cost_round_trip_frac: 0.0003
min_edge_frac: 0.03
edge_basis: per_year
abandon: >-
  Abandon si DSR < 0,95 sur les essais du volet trading, si l'écart de Sharpe avec le panier
  de tous les instruments n'a pas un IC bootstrap à 95 % strictement positif, ou si le
  résultat ne tient pas sur 3 années et sur les deux moitiés des instruments. Hold-out (depuis
  2024-10-01) lu une seule fois, pour le meilleur candidat.
