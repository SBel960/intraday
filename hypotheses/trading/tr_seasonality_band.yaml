id: tr_seasonality_band
title: Heures de la semaine les plus marquées seulement, position tenue
volet: trading
created: "2026-10-14"
mechanism: >-
  Vague 2. La saisonnalité horaire a un Sharpe brut de +2,3 en vague 1 (14 années sur 15),
  mangé par une rotation complète chaque heure. Seules les heures dont le rendement moyen passé
  est exceptionnel (au-delà de 2 ou 3 écarts-types du signal) sont tradées — ouverture de
  Londres et de New York, fixing de 16 h — et la position est tenue tant que le signal reste
  du même côté.
horizon_s: 3600
universe: fx_cfd
features: [close_1h]
parameters:
  - name: horizon_h
    values: [1]
  - name: enter_z
    values: [2, 3]
  - name: exit_z
    values: [0, 1]
cost_round_trip_frac: 0.0003
min_edge_frac: 0.03
edge_basis: per_year
abandon: >-
  Abandon si DSR < 0,95 sur les essais du volet trading, si l'écart de Sharpe avec le panier
  de tous les instruments n'a pas un IC bootstrap à 95 % strictement positif, ou si le
  résultat ne tient pas sur 3 années et sur les deux moitiés des instruments. Hold-out (depuis
  2024-10-01) lu une seule fois, pour le meilleur candidat.
