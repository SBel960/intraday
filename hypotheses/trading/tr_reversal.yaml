id: tr_reversal
title: Retour à la moyenne après un excès de 1 à 24 heures
volet: trading
created: "2026-10-14"
mechanism: >-
  Un ordre important ou une liquidation pousse un prix trop loin ; les teneurs de marché qui
  absorbent ce flux se font payer par le rebond qui suit. Les instruments qui ont le plus monté
  sur k heures sont vendus, ceux qui ont le plus baissé achetés (transversal).
horizon_s: 14400
universe: fx_cfd
features: [close_1h]
parameters:
  - name: lookback_h
    values: [1, 4, 24]
  - name: horizon_h
    values: [1, 4]
cost_round_trip_frac: 0.0003
min_edge_frac: 0.03
edge_basis: per_year
abandon: >-
  Abandon si DSR < 0,95 sur les essais du volet trading, si l'écart de Sharpe avec le panier
  de tous les instruments n'a pas un IC bootstrap à 95 % strictement positif, ou si le
  résultat ne tient pas sur 3 années et sur les deux moitiés des instruments. Hold-out (depuis
  2024-10-01) lu une seule fois, pour le meilleur candidat.
