id: tr_reversal_band
title: Retour à la moyenne sur les seuls excès forts, position tenue jusqu'au retour
volet: trading
created: "2026-10-14"
mechanism: >-
  Vague 2. En vague 1, le retour à la moyenne horaire a un Sharpe brut de +2 (15 années sur
  15), mais il retourne tout le portefeuille chaque heure : frais 6 fois plus grands que le
  gain. Les excès les plus forts (mouvement de k heures au-delà de 2 ou 3 écarts-types
  habituels) concentrent l'essentiel du rebond ; on n'entre que sur eux et on tient jusqu'à ce
  que l'écart soit résorbé (sortie à 0 ou 1 écart-type), ce qui divise la rotation.
horizon_s: 3600
universe: fx_cfd
features: [close_1h]
parameters:
  - name: lookback_h
    values: [1, 4]
  - name: horizon_h
    values: [1]
  - name: enter_z
    values: [2, 3]
  - name: exit_z
    values: [0, 1]
cost_round_trip_frac: 0.0003
min_edge_frac: 0.03
edge_basis: per_year
abandon: >-
  Abandon si DSR < 0,95 sur les essais du volet trading, si l'écart de Sharpe avec le panier
  de tous les instruments n'a pas un IC bootstrap à 95 % strictement positif, ou si le
  résultat ne tient pas sur 3 années et sur les deux moitiés des instruments. Hold-out (depuis
  2024-10-01) lu une seule fois, pour le meilleur candidat.
