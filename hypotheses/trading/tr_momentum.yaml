id: tr_momentum
title: Momentum transversal de 4 heures à 5 jours
volet: trading
created: "2026-10-14"
mechanism: >-
  L'information macro (banques centrales, chiffres d'activité) se diffuse sur plusieurs heures
  ou jours entre les marchés ; les instruments les plus forts sur k heures continuent de faire
  mieux que les plus faibles.
horizon_s: 86400
universe: fx_cfd
features: [close_1h]
parameters:
  - name: lookback_h
    values: [4, 24, 120]
  - name: horizon_h
    values: [1, 4, 24]
cost_round_trip_frac: 0.0003
min_edge_frac: 0.03
edge_basis: per_year
abandon: >-
  Abandon si DSR < 0,95 sur les essais du volet trading, si l'écart de Sharpe avec le panier
  de tous les instruments n'a pas un IC bootstrap à 95 % strictement positif, ou si le
  résultat ne tient pas sur 3 années et sur les deux moitiés des instruments. Hold-out (depuis
  2024-10-01) lu une seule fois, pour le meilleur candidat.
