id: tm_delisting_short
title: Vente à découvert du contrat perpétuel d'un jeton dont Binance annonce le retrait
volet: timing
created: "2026-10-14"
mechanism: >-
  Phase 9 (docs/SPEC_EVENEMENTS.md). Le retrait du spot coupe la principale source de
  liquidité et de demande d'un jeton ; les porteurs vendent avant la date, les teneurs de
  marché se retirent. Le contrat perpétuel du jeton est vendu à découvert à l'ouverture qui
  suit l'annonce (publication + 5 min pour l'historique), tenu k heures, à 1× (liquidation si
  le prix double). Seulement si le contrat est liquide à l'annonce.
horizon_s: 259200
universe: perp
features: [binance_announcements, close_1h]
parameters:
  - name: lookback_h
    values: [24, 72, 168]
  - name: horizon_h
    values: [1]
  - name: signed
    values: [1]
  - name: persistent
    values: [1]
  - name: n_long
    values: [0]
  - name: n_short
    values: [3]
cost_round_trip_frac: 0.0022
min_edge_frac: 0.10
edge_basis: per_year
abandon: >-
  Abandon si moins de 30 annonces exploitables avant le hold-out (puissance insuffisante), si
  DSR < 0,95 sur tous les essais du volet timing, si l'écart de Sharpe avec le buy & hold BTC
  n'a pas un IC bootstrap strictement positif, ou si le résultat ne tient pas sur les années
  et les deux moitiés de l'univers. Hold-out (depuis 2025-10-01) lu une seule fois.
