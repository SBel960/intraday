# Phase 9 (docs/SPEC_EVENEMENTS.md) : annonces Binance, horodatées à la RÉCEPTION.
# Point d'accès public non documenté (accepté le 2026-10-14) : une réponse de forme inattendue
# arrête la collecte. Suffixes : _s secondes.

list_url: https://www.binance.com/bapi/composite/v1/public/cms/article/list/query
catalogs:
  - {id: 48, name: listing}          # « New Cryptocurrency Listing »
  - {id: 161, name: delisting}       # « Delisting »
page_size: 50
request_interval_s: 1.0
latency_margin_s: 300                # backtest : publication + 5 min, puis heure pleine suivante
exchange: binance                    # horloge de référence (max_clock_offset_ms de base.yaml)

# Paper en temps réel (live/paper_events.py), décidé le 2026-10-14 AVANT toute annonce reçue :
# une variante par fiche figée (hypotheses/timing_events), la médiane de sa grille.
paper:
  start_date: "2026-10-14"
  quote: USDT
  min_volume_quote: 1000000          # contrat perpétuel ≥ 1 M USDT échangés sur 24 h
  max_lines: 3
  capital_quote: 50                  # 3 lignes de ~16,7 USDT
  leg_cost_frac: 0.002               # taker 0,05 % + ½ spread et glissement d'un petit contrat
  rules:
    - {kind: delisting, side: -1, hold_h: 72, hypothesis: tm_delisting_short, params: "lookback_h=72"}
    - {kind: listing, side: 1, hold_h: 24, hypothesis: tm_listing_long, params: "lookback_h=24"}

# Communiqués du FOMC (events/calendar.py) : réunions PROGRAMMÉES seulement, relevées le
# 2026-10-14 sur federalreserve.gov (calendrier courant + page historique 2020). Les réunions
# non programmées (mars 2020), annulées et les votes par écrit sont exclus. Contrôle :
# python -m qlab.events.calendar --config config check (signale, ne corrige jamais).
fomc_page_url: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
fomc_history_url: https://www.federalreserve.gov/monetarypolicy/fomchistorical{year}.htm
fomc_statement_time_et: "14:00"     # heure de New York (heure d'été comprise)
fomc_risk_before_min: 30           # aucune nouvelle position de 30 min avant…
fomc_risk_after_min: 120           # …à 2 h après le communiqué
