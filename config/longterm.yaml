# Volet long terme. Suffixes d'unité : _days jours, _frac fraction, _quote devise de cotation.
# Chaque valeur listée dans signals / rebalance est un candidat : l'essayer est un essai journalisé.

universe:
  warmup_days: 30                    # chauffe après la première cotation avant d'entrer dans l'univers

signals:
  momentum_lookbacks_days: [30, 60, 90, 180, 365]
  ma_fast_days: [10, 20, 50]
  ma_slow_days: [100, 200]
  xs_skip_days: 7                    # momentum transversal : on saute les S derniers jours
  xs_top_k: 3
  vol_lookback_days: 30

vol_target:
  target_vol_annual: 0.40
  w_max: 1.0                         # ≤ 1 : pas de levier

rebalance:
  calendar_days: [7, 30, 90]
  band_fracs: [0.10, 0.20]           # toujours ≥ δ_min = minNotional / V, vérifié par lt_costs

dca:
  amount_quote: 10
  period_days: 7

costs:
  fallback_spread_frac: 0.001        # hypothèse conservatrice si pas de bookTicker mesuré (signalée)
  slippage_frac: 0.0005
  eur_conversion_cost_frac: 0.002    # EUR → USDT
  max_drag_edge_fraction: 0.5        # drag > 50 % de l'edge visé ⇒ stratégie non testée
