# Volet long terme. Suffixes d'unité : _days jours, _frac fraction, _quote devise de cotation.
# Chaque valeur listée dans signals / rebalance est un candidat : l'essayer est un essai journalisé.

universe:
  warmup_days: 30                    # chauffe après la première cotation avant d'entrer dans l'univers
  # Univers OBSERVÉ : un actif = une paire en dollar (stablecoin), la première disponible ce jour-là.
  reference_quotes: [USDT, BUSD, USDC, FDUSD, TUSD, USDP, PAX]
  # Pas des actifs : stablecoins et devises (PAXG, adossé à l'or, reste un actif).
  excluded_bases: [USDT, BUSD, USDC, FDUSD, TUSD, TUSDB, USDP, PAX, DAI, UST, SUSD, USDS, USDSB,
                   USDSOLD, USD1, USDE, RLUSD, BFUSD, XUSD, VAI, EUR, AEUR, EURI, GBP, BGBP, AUD]
  leveraged_suffixes: [UP, DOWN, BULL, BEAR]   # BTCUP = BTC + UP ; JUP, SYRUP gardés (J, SYR : pas des bases)
  volume_lookback_days: 30
  min_volume_quote: 1000000          # volume médian quotidien ≥ 1 M$ (décidé le 2026-09-26, avant tout test)
  quote_min_volume: 100000          # univers trade_eur : paires EUR ≥ 100 k€/jour (médiane 30 j), décidé le 2026-09-26

signals:
  momentum_lookbacks_days: [30, 60, 90, 180, 365]
  ma_fast_days: [10, 20, 50]
  ma_slow_days: [100, 200]
  xs_skip_days: 7                    # momentum transversal : on saute les S derniers jours
  xs_top_k: 3
  vol_lookback_days: 30

vol_target:
  target_vol_annual: 0.40
  w_max: 1.0                         # ≤ 1 : pas de levier

rebalance:
  calendar_days: [7, 30, 90]
  band_fracs: [0.10, 0.20]           # toujours ≥ δ_min = minNotional / V, vérifié par lt_costs

dca:
  amount_quote: 10                   # EUR
  period_days: 7

costs:
  fallback_spread_frac: 0.001        # hypothèse conservatrice si pas de bookTicker mesuré (signalée)
  slippage_frac: 0.0005
  eur_conversion_cost_frac: 0.0      # devise de cotation EUR : aucune conversion
  max_drag_edge_fraction: 0.5        # drag > 50 % de l'edge visé ⇒ stratégie non testée
  max_rejected_share: 0.5            # > 50 % du VOLUME voulu sous minNotional ⇒ non réalisable à ce palier (2026-09-26)
  spread_min_samples: 24            # spread mesuré (médiane) utilisé dès 24 relevés horaires, sinon fallback_spread_frac

# Critères d'acceptation (LT.6, tous requis) ; fixés avant le premier backtest de la vague 1.
acceptance:
  dsr_min: 0.95
  confidence: 0.95                   # IC bootstrap de l'écart de Sharpe ; MinTRL au risque 5 %
  min_subperiods: 3                  # années civiles, dont une baissière
  min_assets: 2                      # actifs (ou sous-paniers de 2 pour une fiche multi-actifs)
  require_bear: true
  n_boot: 2000
  mean_block_days: 20                # blocs d'environ 3 semaines : garde l'autocorrélation
  seed: 20260926
