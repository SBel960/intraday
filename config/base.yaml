# Configuration commune intraday + long terme.
# Unités : suffixe _frac = fraction (0.001 = 0,1 %), _quote = devise de cotation, _gb = gigaoctets.

data:
  root: /home/bsouf/qlab-data        # système de fichiers Linux de WSL2, jamais sous /mnt
  disk_budget_gb: 150
  disk_alert_fraction: 0.8           # alerte à 80 % du budget

exchanges:
  - name: binance
    rest_url: https://api.binance.com
    ws_url: wss://stream.binance.com:9443
    # Barème de repli (VIP 0). Le barème réel du compte est relu et versionné par exchange_info.py ;
    # tout changement (repli ou snapshot) déclenche le recalcul des coûts.
    fees:
      maker_frac: 0.001
      taker_frac: 0.001
      bnb_discount_frac: 0.25          # remise si les frais sont payés en BNB
      pay_in_bnb: false
    snapshot_refresh_hours: 24         # exchange_info fetch --if-due : nouveau snapshot si plus vieux
    max_clock_offset_ms: 500           # écart d'horloge local / serveur toléré (mesuré à chaque fetch)

archives:
  binance_vision_url: https://data.binance.vision
  binance_vision_list_url: https://s3-ap-northeast-1.amazonaws.com/data.binance.vision
  tardis_url: https://datasets.tardis.dev
  download_workers: 32                 # téléchargements simultanés (maximum validé ; latence, pas débit)
  list_workers: 32                     # listages simultanés (serveur de listage à Tokyo : ~1 s/requête)
  futures_metrics_symbols: [BTCUSDT, ETHUSDT, SOLUSDT]   # métriques quotidiennes : 1 fichier/jour/paire

symbols:
  # EUR : compte dans l'EEE (MiCA, USDT indisponible) ; pas de conversion EUR → stablecoin.
  quote_asset: EUR
  trade: [BTCEUR, ETHEUR, SOLEUR]    # univers TRADÉ : paires EUR les plus liquides
  intraday: [BTCEUR, ETHEUR]         # inclus dans trade ; volet conditionnel au cost gate

# Univers OBSERVÉ (vue globale du marché) : toutes les paires spot Binance, toutes devises.
observe:
  include_delisted: true             # paires retirées gardées : pas de biais du survivant
  futures_metrics: true              # financement et positions ouvertes (contrats USDⓈ-M)
  kline_intervals: [1d, 1h]

risk:
  max_daily_loss_frac: 0.05          # du capital du palier
  max_open_positions: 1
  max_order_frac: 1.0                # taille max d'un ordre, en fraction du capital

# Paliers de capital, en devise de cotation (EUR), strictement croissants.
# Seuils sur le capital APPORTÉ (dépôts − retraits), jamais sur la valeur du portefeuille :
# on monte de palier en déposant, et une perte ne fait jamais redescendre de palier.
capital_tiers:
  - name: t0
    capital_quote: 50
    max_drawdown_frac: 0.30
  - name: t1
    capital_quote: 200
    max_drawdown_frac: 0.25
  - name: t2
    capital_quote: 1000
    max_drawdown_frac: 0.20

# Clés d'API (lecture seule), hors dépôt et chmod 600 : BINANCE_API_KEY,
# BINANCE_PRIVATE_KEY_PATH (clé Ed25519 privée, jamais transmise). Absent ⇒ frais de repli.
secrets_file: /home/bsouf/intraday/.env
