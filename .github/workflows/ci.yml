# Contrôle à chaque push et pull request : lint, format, typage strict, tests.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installation
        run: pip install -e ".[dev]"
      - name: ruff (lint)
        run: ruff check .
      - name: ruff (format)
        run: ruff format --check .
      - name: mypy --strict
        run: mypy
      - name: pytest
        run: pytest -q
