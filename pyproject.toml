[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qlab"
version = "0.1.0"
description = "Recherche intraday et long terme, crypto spot, petit capital"
requires-python = ">=3.12"
dependencies = [
    "polars",
    "duckdb",
    "numba",
    "numpy",
    "scipy",
    "pyyaml",
    "zstandard",
    "websockets",
]

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/qlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "BLE", "E722"]
ignore = ["PLR2004", "PLR0913", "RUF001", "RUF002", "RUF003"]
